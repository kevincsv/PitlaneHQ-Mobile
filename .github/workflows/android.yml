name: Android CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the GitHub release v<version> with the files
        type: boolean
        default: false
  # by hand only: pushes, tags and pull requests never build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # the release key lives only in GitHub secrets; without it the APK is signed with the CI debug key
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      # Firebase (instant notifications): the project's google-services.json lives only in a secret; without it the
      # app builds without Firebase and notifications use the background check
      - name: Firebase file
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json; fi
          fi
      - name: Build APK and bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Name the files
        run: |
          v="$(cat version.txt)-beta"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PitlaneHQ-Android-$v.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/PitlaneHQ-Android-$v.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-android-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat version.txt)
          # the public history started again at 0.4.1 (the owner's choice): the releases of a higher number go, tags too
          gh release list --limit 300 --json tagName -q '.[].tagName' 2>/dev/null | while read -r t; do o="${t#v}"; o="${o%-beta}"; [[ "$o" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue; [ "$o" = "$v" ] && continue; [ "$(printf '%s\n%s\n' "$v" "$o" | sort -V | tail -1)" = "$o" ] && gh release delete "$t" -y --cleanup-tag || true; done
          tag="v$v-beta"
          # the release notes are this version's part of CHANGELOG.md
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $v beta" --notes-file notes.md --latest || true
          # also under a fixed name: the web links to releases/latest/download/<name>, always the newest
          cp "out/PitlaneHQ-Android-$VERSION.apk" out/PitlaneHQ-Android.apk
          gh release upload "$tag" out/* --clobber
          gh release edit "$tag" --latest --prerelease=false || true
      # only master's builds go out: a build started on another branch only checks that it compiles
      - name: Publish on pitlanehq.app (R2)
        if: env.HAS_CLOUDFLARE == 'true' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "pitlanehq-downloads/PitlaneHQ-Android.apk" --file "out/PitlaneHQ-Android-$VERSION.apk" --remote --content-type application/vnd.android.package-archive
          npx --yes wrangler@4 r2 object put "pitlanehq-downloads/PitlaneHQ-Android.aab" --file "out/PitlaneHQ-Android-$VERSION.aab" --remote --content-type application/octet-stream
          npx --yes wrangler@4 r2 object put "pitlanehq-downloads/CHANGELOG-phones.md" --file CHANGELOG.md --remote --content-type text/markdown
          # phones.json goes last: the apps only see a new version once its files are there (keeps the other platform's file)
          cur=$(curl -fsSL https://pitlanehq.app/dl/phones.json 2>/dev/null || echo '{}')
          node -e 'const c=JSON.parse(process.argv[1]);c.version=process.argv[2];c.apk="PitlaneHQ-Android.apk";c.aab="PitlaneHQ-Android.aab";c.date=new Date().toISOString();require("fs").writeFileSync("phones.json",JSON.stringify(c))' "$cur" "$(cat version.txt)"
          npx --yes wrangler@4 r2 object put "pitlanehq-downloads/phones.json" --file phones.json --remote --content-type application/json

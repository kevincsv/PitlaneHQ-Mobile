name: iOS CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the GitHub release v<version> with the files
        type: boolean
        default: false
  # by hand only: pushes, tags and pull requests never build

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PitlaneHQ.xcodeproj -scheme PitlaneHQ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION="$(cat ../version.txt)" build 2>&1 | tee build.log | grep -E "error:|warning: .*PitlaneHQ/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          v="$(cat ../version.txt)-beta"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p Payload ../out
          cp -R build/Build/Products/Release-iphoneos/PitlaneHQ.app Payload/
          zip -qry "../out/PitlaneHQ-iOS-$v-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pitlanehq-ios-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat version.txt)
          # the public history started again at 0.4.1 (the owner's choice): the releases of a higher number go, tags too
          gh release list --limit 300 --json tagName -q '.[].tagName' 2>/dev/null | while read -r t; do o="${t#v}"; o="${o%-beta}"; [[ "$o" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue; [ "$o" = "$v" ] && continue; [ "$(printf '%s\n%s\n' "$v" "$o" | sort -V | tail -1)" = "$o" ] && gh release delete "$t" -y --cleanup-tag || true; done
          tag="v$v-beta"
          # the release notes are this version's part of CHANGELOG.md
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Pitlane HQ $v beta" --notes-file notes.md --latest || true
          # also under a fixed name: the web links to releases/latest/download/<name>, always the newest
          cp "out/PitlaneHQ-iOS-$VERSION-unsigned.ipa" out/PitlaneHQ-iOS-unsigned.ipa
          gh release upload "$tag" out/* --clobber
          gh release edit "$tag" --latest --prerelease=false || true

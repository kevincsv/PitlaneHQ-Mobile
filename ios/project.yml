name: PitlaneHQ
options:
  bundleIdPrefix: com.pitlanehq
  deploymentTarget:
    iOS: "16.0"
targets:
  PitlaneHQ:
    type: application
    platform: iOS
    sources:
      - path: PitlaneHQ
      # the web's lap analysis and coach, the copy the app runs until it downloads the newest (tools/sync-analysis.sh)
      - path: Resources/pitwall-analysis.js
        buildPhase: resources
    scheme: {}
    info:
      path: PitlaneHQ/Info.plist
      properties:
        CFBundleDisplayName: Pitlane HQ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "25"
        UILaunchScreen: {}
        # pitlanehq://steam and pitlanehq://discord: back from Steam's or Discord's sign-in (the sign-in sheet takes them)
        CFBundleURLTypes:
          - CFBundleURLName: com.pitlanehq.ios.signin
            CFBundleURLSchemes:
              - pitlanehq
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitlanehq.ios
        MARKETING_VERSION: "0.3.0" # the CI sets it from version.txt
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
